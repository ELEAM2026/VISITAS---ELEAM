<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Visitas ELEAM</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
body{background:#0d1117;color:#fff;font-family:'Segoe UI',system-ui,sans-serif;min-height:100vh}
input::placeholder{color:rgba(255,255,255,0.25)}
::-webkit-scrollbar{display:none}
</style>
</head>
<body>
<div id="root"></div>
<script>
firebase.initializeApp({databaseURL:"https://visitas---eleam-default-rtdb.firebaseio.com"});
var db=firebase.database();
</script>
<script type="text/babel" data-presets="react">
const TIME_SLOTS=["09:00 - 10:00","10:00 - 11:00","11:00 - 12:00","12:00 - 13:00","13:00 - 14:00","14:00 - 15:00","15:00 - 16:00","16:00 - 17:00","17:00 - 18:00"];
const MAX_PER_DAY=3;
const DOW_COLOR={0:"#e74c3c",1:"#3498db",2:"#27ae60",3:"#e67e22",4:"#9b59b6",5:"#1abc9c",6:"#e91e8c"};
function getMonthDays(){
  const today=new Date();today.setHours(0,0,0,0);
  const year=today.getFullYear(),month=today.getMonth();
  const lastDay=new Date(year,month+1,0).getDate();
  const days=[];
  for(let d=today.getDate();d<=lastDay;d++){
    const date=new Date(year,month,d);
    const dow=date.getDay();
    const key=date.toISOString().split("T")[0];
    const dayName=date.toLocaleDateString("es-CL",{weekday:"long"});
    const dateStr=date.toLocaleDateString("es-CL",{day:"numeric",month:"short"});
    days.push({key,dayName,dateStr,isToday:d===today.getDate(),dow});
  }
  return days;
}
function timeKey(t){return t.replace(/:/g,"-").replace(/ /g,"");}
function getDayVisits(visits,dayKey){return TIME_SLOTS.flatMap(t=>(visits[dayKey]&&visits[dayKey][timeKey(t)])||[]);}
function App(){
const[visits,setVisits]=React.useState({});
const[selectedDay,setSelectedDay]=React.useState(null);
const[modal,setModal]=React.useState(null);
const[form,setForm]=React.useState({name:""});
const[cancelName,setCancelName]=React.useState("");
const[message,setMessage]=React.useState(null);
const[view,setView]=React.useState("month");
const[cancelMode,setCancelMode]=React.useState(false);
const days=getMonthDays();
React.useEffect(()=>{if(days.length>0)setSelectedDay(days[0].key);const ref=db.ref("visitas");ref.on("value",snap=>{setVisits(snap.val()||{});});return()=>ref.off();},[]);
function showMsg(text,type){setMessage({text,type:type||"success"});setTimeout(()=>setMessage(null),3500);}
function getSlot(dayKey,time){return(visits[dayKey]&&visits[dayKey][timeKey(time)])||[];}
function openSlot(dayKey,time){setForm({name:""});setCancelName("");setCancelMode(false);setModal({dayKey,time});}
async function addVisit(){if(!form.name.trim())return showMsg("Por favor escribe tu nombre.","error");if(getDayVisits(visits,modal.dayKey).length>=MAX_PER_DAY)return showMsg("Este dia ya tiene 3 visitas.","error");const slot=getSlot(modal.dayKey,modal.time);await db.ref("visitas/"+modal.dayKey+"/"+timeKey(modal.time)).set([...slot,{name:form.name.trim()}]);setModal(null);showMsg("Visita registrada: "+form.name.trim());}
async function cancelVisit(){if(!cancelName.trim())return showMsg("Ingresa el nombre.","error");const slot=getSlot(modal.dayKey,modal.time);const idx=slot.findIndex(v=>v.name.toLowerCase()===cancelName.trim().toLowerCase());if(idx===-1)return showMsg("No se encontro ese nombre.","error");const newSlot=slot.filter((_,i)=>i!==idx);await db.ref("visitas/"+modal.dayKey+"/"+timeKey(modal.time)).set(newSlot.length?newSlot:null);setModal(null);showMsg("Visita cancelada correctamente.");}
const currentDay=days.find(d=>d.key===selectedDay);
const accent=currentDay?DOW_COLOR[currentDay.dow]||"#3498db":"#3498db";
const monthName=new Date().toLocaleDateString("es-CL",{month:"long",year:"numeric"});
return(<div style={{minHeight:"100vh",background:"#0d1117"}}>
<div style={{background:"rgba(255,255,255,0.04)",borderBottom:"1px solid rgba(255,255,255,0.08)",padding:"18px 20px 14px",textAlign:"center",position:"sticky",top:0,zIndex:100}}>
<div style={{fontSize:26}}>🏠</div><h1 style={{margin:"4px 0 2px",fontSize:20,fontWeight:800}}>Visitas ELEAM</h1>
<p style={{margin:0,fontSize:12,color:"rgba(255,255,255,0.4)",textTransform:"capitalize"}}>Max. {MAX_PER_DAY} visitas por dia - {monthName}</p>
<div style={{display:"flex",justifyContent:"center",gap:6,marginTop:12}}>{[["month","Mes"],["day","Dia"]].map(([v,label])=>(<button key={v} onClick={()=>setView(v)} style={{padding:"6px 18px",borderRadius:20,border:"none",background:view===v?accent:"rgba(255,255,255,0.08)",color:view===v?"#fff":"rgba(255,255,255,0.5)",fontWeight:600,fontSize:13,cursor:"pointer"}}>{label}</button>))}</div>
</div>
{message&&<div style={{position:"fixed",top:16,left:"50%",transform:"translateX(-50%)",background:message.type==="error"?"#c0392b":"#27ae60",color:"#fff",padding:"11px 22px",borderRadius:10,fontWeight:600,fontSize:13,zIndex:9999,whiteSpace:"nowrap"}}>{message.text}</div>}
<div style={{maxWidth:540,margin:"0 auto",padding:"16px"}}>
{view==="month"&&(()=>{const today=new Date();today.setHours(0,0,0,0);const year=today.getFullYear(),month=today.getMonth();const first=new Date(year,month,1),last=new Date(year,month+1,0);const pad=first.getDay()===0?0:first.getDay();const cells=[...Array(pad)].map(()=>null);for(let d=1;d<=last.getDate();d++){const date=new Date(year,month,d);const key=date.toISOString().split("T")[0];const dow=date.getDay();cells.push({d,key,dow,isPast:date<today,isToday:d===today.getDate(),count:getDayVisits(visits,key).length});}const rows=[];for(let i=0;i<cells.length;i+=7)rows.push(cells.slice(i,i+7));return(<div><div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:4,marginBottom:6}}>{["D","L","M","X","J","V","S"].map(d=><div key={d} style={{textAlign:"center",fontSize:11,color:"rgba(255,255,255,0.3)",fontWeight:700,padding:"4px 0"}}>{d}</div>)}</div>{rows.map((row,ri)=>(<div key={ri} style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:4,marginBottom:4}}>{row.map((cell,ci)=>{if(!cell)return <div key={ci}/>;const{d,key,dow,isPast,isToday,count}=cell;const isFull=count>=MAX_PER_DAY,isSelected=selectedDay===key;const color=DOW_COLOR[dow]||"#888";return(<button key={ci} disabled={isPast} onClick={()=>{setSelectedDay(key);setView("day");}} style={{padding:"8px 2px 6px",borderRadius:10,border:isSelected?"2px solid "+color:isToday?"2px solid rgba(255,255,255,0.3)":"2px solid transparent",background:isSelected?color+"22":isPast?"transparent":"rgba(255,255,255,0.04)",color:isPast?"rgba(255,255,255,0.18)":"#fff",cursor:isPast?"default":"pointer",display:"flex",flexDirection:"column",alignItems:"center",gap:4}}><span style={{fontSize:14,fontWeight:isToday?800:500}}>{d}</span>{!isPast&&<div style={{display:"flex",gap:2}}>{[...Array(MAX_PER_DAY)].map((_,i)=><div key={i} style={{width:5,height:5,borderRadius:"50%",background:i<count?(isFull?"#e74c3c":"#f39c12"):"rgba(255,255,255,0.12)"}}/>)}</div>}</button>);})}</div>))}<div style={{display:"flex",gap:14,justifyContent:"center",marginTop:14,flexWrap:"wrap"}}>{[{c:"rgba(255,255,255,0.12)",l:"Sin visitas"},{c:"#f39c12",l:"Con visitas"},{c:"#e74c3c",l:"Dia lleno"}].map(x=>(<div key={x.l} style={{display:"flex",alignItems:"center",gap:5}}><div style={{width:10,height:10,borderRadius:"50%",background:x.c}}/><span style={{color:"rgba(255,255,255,0.45)",fontSize:11}}>{x.l}</span></div>))}</div><div style={{textAlign:"center",marginTop:10,color:"rgba(255,255,255,0.22)",fontSize:12}}>Toca un dia para ver y agendar horarios</div></div>);})()}
{view==="day"&&currentDay&&(<div><div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:16}}><button onClick={()=>{const i=days.findIndex(d=>d.key===selectedDay);if(i>0)setSelectedDay(days[i-1].key);}} style={{background:"rgba(255,255,255,0.08)",border:"none",color:"#fff",borderRadius:8,padding:"8px 16px",fontSize:20,cursor:"pointer"}}>&#8249;</button><div style={{textAlign:"center"}}><div style={{color:accent,fontWeight:800,fontSize:18,textTransform:"capitalize"}}>{currentDay.dayName}</div><div style={{color:"rgba(255,255,255,0.45)",fontSize:13}}>{currentDay.dateStr}</div>{(()=>{const c=getDayVisits(visits,selectedDay).length,f=c>=MAX_PER_DAY;return<div style={{display:"inline-block",marginTop:5,padding:"2px 12px",borderRadius:20,fontSize:11,fontWeight:700,background:f?"#e74c3c22":"#27ae6022",color:f?"#e74c3c":"#27ae60"}}>{c}/{MAX_PER_DAY} {f?"DIA COMPLETO":"hay cupo"}</div>})()}</div><button onClick={()=>{const i=days.findIndex(d=>d.key===selectedDay);if(i<days.length-1)setSelectedDay(days[i+1].key);}} style={{background:"rgba(255,255,255,0.08)",border:"none",color:"#fff",borderRadius:8,padding:"8px 16px",fontSize:20,cursor:"pointer"}}>&#8250;</button></div><div style={{display:"flex",flexDirection:"column",gap:10}}>{TIME_SLOTS.map(time=>{const slot=getSlot(selectedDay,time),count=slot.length;const dayFull=getDayVisits(visits,selectedDay).length>=MAX_PER_DAY;const dot=count>0?"#f39c12":dayFull?"rgba(255,255,255,0.15)":"#27ae60";return(<div key={time} onClick={()=>openSlot(selectedDay,time)} style={{background:"rgba(255,255,255,0.05)",borderRadius:14,padding:"14px 16px",border:"1px solid rgba(255,255,255,0.08)",cursor:"pointer",display:"flex",alignItems:"center",gap:14}}><div style={{width:12,height:12,borderRadius:"50%",background:dot,flexShrink:0}}/><div style={{flex:1}}><div style={{fontWeight:700,fontSize:15}}>{time}</div>{count>0&&<div style={{marginTop:5,display:"flex",flexWrap:"wrap",gap:5}}>{slot.map((v,i)=><span key={i} style={{background:accent+"22",border:"1px solid "+accent+"44",color:"rgba(255,255,255,0.85)",fontSize:12,padding:"3px 9px",borderRadius:6}}>👤 {v.name}</span>)}</div>}{count===0&&<div style={{color:"rgba(255,255,255,0.25)",fontSize:12,marginTop:2}}>{dayFull?"Sin cupos":"Toca para agendar"}</div>}</div>{count>0&&<div style={{fontSize:11,color:"rgba(255,255,255,0.3)",flexShrink:0}}>{count} persona{count!==1?"s":""}</div>}</div>);})}</div></div>)}
</div>
{modal&&(()=>{const slot=getSlot(modal.dayKey,modal.time);const dayFull=getDayVisits(visits,modal.dayKey).length>=MAX_PER_DAY;const day=days.find(d=>d.key===modal.dayKey);const count=getDayVisits(visits,modal.dayKey).length;return(<div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.75)",display:"flex",alignItems:"flex-end",justifyContent:"center",zIndex:600}} onClick={e=>{if(e.target===e.currentTarget)setModal(null);}}><div style={{background:"#161b22",border:"1px solid rgba(255,255,255,0.12)",borderRadius:"22px 22px 0 0",padding:"22px 20px 36px",width:"100%",maxWidth:540}}><div style={{textAlign:"center",marginBottom:18}}><div style={{color:"rgba(255,255,255,0.4)",fontSize:12,textTransform:"capitalize"}}>{day&&day.dayName} - {day&&day.dateStr}</div><div style={{fontWeight:800,fontSize:20,marginTop:2}}>{modal.time}</div><div style={{display:"inline-block",marginTop:6,padding:"3px 14px",borderRadius:20,fontSize:12,fontWeight:700,background:dayFull?"#e74c3c22":"#27ae6022",color:dayFull?"#e74c3c":"#27ae60"}}>{count}/{MAX_PER_DAY} hoy {dayFull?"COMPLETO":"hay cupo"}</div></div>
{slot.length>0&&(<div style={{display:"flex",gap:8,marginBottom:14}}><button onClick={()=>setCancelMode(false)} style={{flex:1,padding:"9px",borderRadius:10,border:"none",background:!cancelMode?"#27ae60":"rgba(255,255,255,0.06)",color:"#fff",fontWeight:700,fontSize:13,cursor:"pointer"}}>Agendar</button><button onClick={()=>setCancelMode(true)} style={{flex:1,padding:"9px",borderRadius:10,border:"none",background:cancelMode?"#c0392b":"rgba(255,255,255,0.06)",color:"#fff",fontWeight:700,fontSize:13,cursor:"pointer"}}>Cancelar visita</button></div>)}
{!cancelMode&&!dayFull&&(<div style={{background:"#27ae6012",border:"1px solid #27ae6030",borderRadius:14,padding:16,marginBottom:12}}><div style={{color:"#27ae60",fontWeight:700,fontSize:13,marginBottom:10}}>Agendar visita</div><input autoFocus placeholder="Nombre del residente" value={form.name} onChange={e=>setForm({name:e.target.value})} onKeyDown={e=>e.key==="Enter"&&addVisit()} style={{width:"100%",padding:"11px 13px",borderRadius:10,border:"1px solid rgba(255,255,255,0.12)",background:"rgba(255,255,255,0.06)",color:"#fff",fontSize:14,outline:"none",marginBottom:10}}/><button onClick={addVisit} style={{width:"100%",padding:12,borderRadius:10,background:"#27ae60",border:"none",color:"#fff",fontWeight:700,fontSize:15,cursor:"pointer"}}>Registrar</button></div>)}
{!cancelMode&&dayFull&&(<div style={{background:"#e74c3c12",border:"1px solid #e74c3c30",borderRadius:14,padding:16,marginBottom:12,textAlign:"center"}}><div style={{fontSize:24,marginBottom:6}}>🚫</div><div style={{color:"#e74c3c",fontWeight:700,fontSize:14}}>Dia completo</div><div style={{color:"rgba(255,255,255,0.4)",fontSize:12,marginTop:4}}>Ya hay 3 visitas agendadas</div></div>)}
{cancelMode&&slot.length>0&&(<div style={{background:"#e74c3c12",border:"1px solid #e74c3c30",borderRadius:14,padding:16,marginBottom:12}}><div style={{color:"rgba(255,255,255,0.6)",fontSize:12,marginBottom:8}}>Visitas en este horario:</div><div style={{marginBottom:12,display:"flex",flexWrap:"wrap",gap:5}}>{slot.map((v,i)=><span key={i} style={{background:"rgba(255,255,255,0.08)",color:"rgba(255,255,255,0.8)",fontSize:12,padding:"4px 10px",borderRadius:6}}>👤 {v.name}</span>)}</div><input placeholder="Escribe el nombre del residente" value={cancelName} onChange={e=>setCancelName(e.target.value)} onKeyDown={e=>e.key==="Enter"&&cancelVisit()} style={{width:"100%",padding:"11px 13px",borderRadius:10,border:"1px solid rgba(255,255,255,0.12)",background:"rgba(255,255,255,0.06)",color:"#fff",fontSize:14,outline:"none",marginBottom:10}}/><button onClick={cancelVisit} style={{width:"100%",padding:12,borderRadius:10,background:"#c0392b",border:"none",color:"#fff",fontWeight:700,fontSize:15,cursor:"pointer"}}>Confirmar cancelacion</button></div>)}
<button onClick={()=>setModal(null)} style={{width:"100%",padding:12,borderRadius:10,background:"rgba(255,255,255,0.06)",border:"1px solid rgba(255,255,255,0.08)",color:"rgba(255,255,255,0.5)",fontWeight:600,fontSize:14,cursor:"pointer"}}>Cerrar</button></div></div>);})()}
</div>);
}
const root=ReactDOM.createRoot(document.getElementById("root"));
root.render(<App/>);
</script>
</body>
</html>
